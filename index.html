<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Speaker Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border-radius: 8px;
    }
    input { width: 120px; }
    button { margin-top: 5px; }
  </style>
</head>
<body>

<div id="ui">
  <div>Volume</div>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">

  <div>Frequency</div>
  <input id="freq" type="range" min="100" max="2000" step="1" value="440">

  <br>
  <button id="addSpeaker">Add Speaker</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ===== SCENE SETUP =====
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 6);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Room
const room = new THREE.Mesh(
  new THREE.BoxGeometry(10, 5, 10),
  new THREE.MeshBasicMaterial({ color: 0x444444, wireframe: true })
);
scene.add(room);

// Light (optional visual clarity)
const light = new THREE.PointLight(0xffffff, 1);
light.position.set(5,5,5);
scene.add(light);

// ===== AUDIO SETUP =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const speakers = [];

function createSpeaker(x=0,y=1,z=0) {
  // 3D object
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,0.5,0.5),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
  );
  mesh.position.set(x,y,z);
  scene.add(mesh);

  // Audio chain
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  const panner = audioCtx.createPanner();

  osc.type = "sine";
  osc.frequency.value = 440;

  gain.gain.value = 0.5;
  filter.type = "lowpass";

  panner.panningModel = "HRTF";

  osc.connect(filter).connect(gain).connect(panner).connect(audioCtx.destination);
  osc.start();

  const speaker = { mesh, osc, gain, filter, panner };
  speakers.push(speaker);

  return speaker;
}

// Initial speaker
let selectedSpeaker = createSpeaker(1,1,0);

// ===== UI =====
const volumeSlider = document.getElementById("volume");
const freqSlider = document.getElementById("freq");

volumeSlider.oninput = () => {
  if(selectedSpeaker) selectedSpeaker.gain.gain.value = volumeSlider.value;
};

freqSlider.oninput = () => {
  if(selectedSpeaker) selectedSpeaker.osc.frequency.value = freqSlider.value;
};

document.getElementById("addSpeaker").onclick = () => {
  selectedSpeaker = createSpeaker(
    (Math.random()-0.5)*5,
    1,
    (Math.random()-0.5)*5
  );
};

// ===== INTERACTION (CLICK SELECT) =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const meshes = speakers.map(s => s.mesh);
  const intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    selectedSpeaker = speakers.find(s => s.mesh === intersects[0].object);
  }
});

// ===== AUDIO POSITION UPDATE =====
function updateAudio() {
  speakers.forEach(s => {
    s.panner.positionX.value = s.mesh.position.x;
    s.panner.positionY.value = s.mesh.position.y;
    s.panner.positionZ.value = s.mesh.position.z;
  });

  audioCtx.listener.positionX.value = camera.position.x;
  audioCtx.listener.positionY.value = camera.position.y;
  audioCtx.listener.positionZ.value = camera.position.z;
}

// ===== BASIC CAMERA CONTROL =====
window.addEventListener("keydown", (e) => {
  const speed = 0.3;
  if (e.key === "w") camera.position.z -= speed;
  if (e.key === "s") camera.position.z += speed;
  if (e.key === "a") camera.position.x -= speed;
  if (e.key === "d") camera.position.x += speed;
});

// ===== LOOP =====
function animate() {
  requestAnimationFrame(animate);
  updateAudio();
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
