<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Speaker Simulator</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background:#11151a; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: #141b24f5;
      color: #eaf2fa;
      padding: 14px;
      border:1px solid #405365;
      border-radius: 12px;
      box-shadow:0 12px 32px #0006;
    }
    #ui { box-sizing: border-box; width: min(290px, calc(100vw - 20px)); max-height: calc(100dvh - 20px); overflow-y: auto; }
    input { width: 100%; }
    button, select { min-height: 44px; background:#263746; color:#eff9ff; border:1px solid #52697c; border-radius:7px; font:inherit; font-size:14px; padding:6px 10px; }
    button { margin-top: 5px; cursor: pointer; }
    button:hover { background:#344c60; }
    button:disabled,select:disabled { opacity:.45; cursor:default; }
    select { width: 100%; }
    input { accent-color:#8bddc4; }
    input[type=number] { background:#0d131b; color:#eff9ff; border:1px solid #52697c; border-radius:5px; padding:6px; font:inherit; }
    label { font-size:13px; color:#cbd9e6; }
    .transport { display:flex; align-items:center; gap:12px; position:sticky; top:-14px; z-index:2; padding:8px 0; margin-top:-8px; background:#141b24; }
    #toggleAudio { flex-shrink:0; margin:0; background:#294f48; border-color:#77bea9; }
    #audioStatus { font-size:12px; line-height:1.4; margin:0; color:#cbd9e6; }
    #sceneStatus:empty { display:none; }
    #sceneStatus { font-size:12px; line-height:1.5; color:#a1e3d1; }
    output { float: right; font-variant-numeric: tabular-nums; }
    .actions { margin-bottom: 14px; }
    .actions, #movement { display: flex; gap: 8px; }
    .actions button, #movement button { flex: 1; }
    #movement { margin-top: 10px; }
    details { margin: 10px 0; } summary { cursor: pointer; padding: 7px 0; } details p { font-size: 13px; line-height: 1.5; } .position-fields { display:flex; gap:8px; } .position-fields label { min-width:0; flex:1; } .position-fields input { box-sizing:border-box; min-height:36px; } #listenerPosition { font-size:12px; color:#cbd5e1; }
    :focus-visible { outline: 3px solid #ffcc00; outline-offset: 2px; }
    @media(max-width:600px) {
      #ui { top:auto; bottom:10px; width:calc(100vw - 20px); max-height:46dvh; overscroll-behavior:contain; scrollbar-width:thin; }
      #movement { position:relative; }
    }
  </style>
</head>
<body>

<div id="ui">
  <div class="transport"><button id="toggleAudio" aria-pressed="false">Start audio</button>
  <p id="audioStatus" role="status">Audio stopped.</p></div>
  <details><summary>Scene</summary>
    <label for="scenePreset">Preset</label><select id="scenePreset"><option value="single">Single tone</option><option value="stereo">Stereo pair</option><option value="surround">Four corners</option></select>
    <div class="actions"><button id="applyScene">Apply</button><button id="saveScene">Save</button><button id="loadScene">Restore</button></div>
    <p id="sceneStatus" role="status"></p>
  </details>
  <label for="speakerSelect">Speaker</label>
  <select id="speakerSelect"></select>
  <div class="actions"><button id="addSpeaker">Add speaker</button><button id="removeSpeaker">Remove</button></div>
  <label for="volume">Volume</label><output id="volumeValue" for="volume">50%</output><br>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">

  <br><label for="freq">Frequency</label><output id="freqValue" for="freq">440 Hz</output><br>
  <input id="freq" type="range" min="100" max="2000" step="1" value="440">

  <details><summary>Position</summary>
    <div class="position-fields"><label>X<input id="speakerX" type="number" min="-5" max="5" step="0.1"></label><label>Y<input id="speakerY" type="number" min="0" max="5" step="0.1"></label><label>Z<input id="speakerZ" type="number" min="-5" max="5" step="0.1"></label></div>
  </details>
  <p id="listenerPosition" aria-live="off"></p>
  <div id="movement" role="group" aria-label="Move listener">
    <button data-move="a" aria-label="Move left">←</button>
    <button data-move="w" aria-label="Move forward">↑</button>
    <button data-move="s" aria-label="Move back">↓</button>
    <button data-move="d" aria-label="Move right">→</button>
  </div>
  <details><summary>Info</summary><p>WASD or arrows move the listener. Yellow marks the selected speaker. Scene presets and Restore stop audio. Save stores one scene in this browser.</p><p>Spatial audio demonstration; walls do not simulate reflections or absorption.</p></details>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ===== SCENE SETUP =====
const scene = new THREE.Scene();

function sceneViewport() {
  const width = Math.max(1, window.innerWidth);
  // Reserve the mobile control pane (46dvh), its bottom margin, and a small gap.
  const height = Math.max(1, width <= 600 ? Math.floor(window.innerHeight * 0.54) - 20 : window.innerHeight);
  return {width, height};
}
const initialViewport = sceneViewport();
const camera = new THREE.PerspectiveCamera(75, initialViewport.width/initialViewport.height, 0.1, 1000);
camera.position.set(0, 2, 6);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(initialViewport.width, initialViewport.height);
document.body.appendChild(renderer.domElement);

// Room
const room = new THREE.Mesh(
  new THREE.BoxGeometry(10, 5, 10),
  new THREE.MeshBasicMaterial({ color: 0x444444, wireframe: true })
);
scene.add(room);

// Light (optional visual clarity)
const light = new THREE.PointLight(0xffffff, 1);
light.position.set(5,5,5);
scene.add(light);

// ===== AUDIO SETUP =====
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const masterGain = audioCtx.createGain();
masterGain.gain.value = 0;
masterGain.connect(audioCtx.destination);
let audioEnabled = false;
let audioPending = false;
let audioStartVersion = 0;

const speakers = [];
let nextSpeakerId = 1;

function createSpeaker(x=0,y=1,z=0) {
  // 3D object
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.5,0.5,0.5),
    new THREE.MeshBasicMaterial({ color: 0xff0000 })
  );
  mesh.position.set(x,y,z);
  scene.add(mesh);

  // Audio chain
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  const panner = audioCtx.createPanner();

  osc.type = "sine";
  osc.frequency.value = 440;

  gain.gain.value = 0.5;
  filter.type = "lowpass";

  panner.panningModel = "HRTF";

  osc.connect(filter).connect(gain).connect(panner).connect(masterGain);
  osc.start();

  const speaker = { id: nextSpeakerId++, mesh, osc, gain, filter, panner };
  speakers.push(speaker);

  return speaker;
}

// Initial speaker
let selectedSpeaker = createSpeaker(1,1,0);

// ===== UI =====
const volumeSlider = document.getElementById("volume");
const freqSlider = document.getElementById("freq");
const toggleAudio = document.getElementById("toggleAudio");
const audioStatus = document.getElementById("audioStatus");
const speakerSelect = document.getElementById("speakerSelect");
const removeSpeakerButton = document.getElementById("removeSpeaker");
const volumeValue = document.getElementById("volumeValue");
const freqValue = document.getElementById("freqValue");

toggleAudio.onclick = async () => {
  if (!speakers.length) return;
  const request = ++audioStartVersion;
  audioPending = true;
  toggleAudio.disabled = true;
  try {
    if (!audioEnabled) await audioCtx.resume();
    if (request !== audioStartVersion || !speakers.length) return;
    audioEnabled = !audioEnabled;
    masterGain.gain.setTargetAtTime(audioEnabled ? 1 : 0, audioCtx.currentTime, 0.02);
    toggleAudio.textContent = audioEnabled ? "Stop audio" : "Start audio";
    toggleAudio.setAttribute("aria-pressed", String(audioEnabled));
    audioStatus.textContent = audioEnabled ? "Audio playing." : "Audio stopped.";
  } catch {
    if (request === audioStartVersion) audioStatus.textContent = "Audio could not start. Select Start audio to try again.";
  } finally {
    if (request === audioStartVersion) {
      audioPending = false;
      toggleAudio.disabled = !speakers.length;
    }
  }
};

function selectSpeaker(speaker) {
  selectedSpeaker = speaker;
  volumeSlider.disabled = freqSlider.disabled = removeSpeakerButton.disabled = !speaker;
  speakerSelect.disabled = !speaker;
  toggleAudio.disabled = audioPending || !speakers.length;
  speakerSelect.innerHTML = speakers.length
    ? speakers.map(s => `<option value="${s.id}">Speaker ${s.id}</option>`).join('')
    : '<option>No speakers</option>';
  speakerSelect.value = speaker ? String(speaker.id) : '';
  volumeSlider.value = String(speaker ? speaker.gain.gain.value : 0);
  freqSlider.value = String(speaker ? speaker.osc.frequency.value : 440);
  ['X','Y','Z'].forEach(axis => {
    const input = document.getElementById('speaker' + axis);
    input.disabled = !speaker;
    input.value = String(speaker ? speaker.mesh.position[axis.toLowerCase()] : 0);
  });
  updateReadouts();
  speakers.forEach(s => s.mesh.material.color.set(s === speaker ? 0xffcc00 : 0xff0000));
}
function updateReadouts() {
  volumeValue.textContent = `${Math.round(Number(volumeSlider.value) * 100)}%`;
  freqValue.textContent = `${freqSlider.value} Hz`;
}
selectSpeaker(selectedSpeaker);
speakerSelect.onchange = () => selectSpeaker(speakers.find(s => String(s.id) === speakerSelect.value));

function removeSelectedSpeaker() {
  if (!selectedSpeaker) return;
  const speaker = selectedSpeaker;
  const index = speakers.indexOf(speaker);
  speakers.splice(index, 1);
  speaker.osc.stop();
  [speaker.osc, speaker.filter, speaker.gain, speaker.panner].forEach(node => node.disconnect());
  scene.remove(speaker.mesh);
  speaker.mesh.geometry.dispose();
  speaker.mesh.material.dispose();
  selectSpeaker(speakers[Math.min(index, speakers.length - 1)] || null);
  if (!speakers.length) {
    audioStartVersion++;
    audioPending = false;
    audioEnabled = false;
    masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.02);
    toggleAudio.textContent = 'Start audio';
    toggleAudio.setAttribute('aria-pressed', 'false');
    audioStatus.textContent = 'No speakers. Add a speaker to continue.';
    document.getElementById('addSpeaker').focus();
  } else speakerSelect.focus();
}
removeSpeakerButton.onclick = removeSelectedSpeaker;

volumeSlider.oninput = () => {
  if(selectedSpeaker) selectedSpeaker.gain.gain.value = Number(volumeSlider.value);
  updateReadouts();
};

freqSlider.oninput = () => {
  if(selectedSpeaker) selectedSpeaker.osc.frequency.value = Number(freqSlider.value);
  updateReadouts();
};

document.getElementById("addSpeaker").onclick = () => {
  if (speakers.length >= 32) { audioStatus.textContent = 'Scene limit: 32 speakers. Remove one before adding another.'; return; }
  selectSpeaker(createSpeaker(
    (Math.random()-0.5)*5,
    1,
    (Math.random()-0.5)*5
  ));
  if (speakers.length === 1) audioStatus.textContent = 'Audio stopped. Select Start audio.';
};

// Presets are reproducible; restored scenes always begin muted.
const SCENE_KEY = 'speaker-simulator.scene.v1';
const SCENE_PRESETS = {
  single: [[1,1,0,440,0.5]],
  stereo: [[-2,1,0,330,0.25],[2,1,0,440,0.25]],
  surround: [[-3,1,-3,220,0.15],[3,1,-3,330,0.15],[-3,1,3,440,0.15],[3,1,3,550,0.15]]
};
function serializeScene() {
  return {version:1, listener:[camera.position.x,camera.position.y,camera.position.z], speakers:speakers.map(s => [s.mesh.position.x,s.mesh.position.y,s.mesh.position.z,s.osc.frequency.value,s.gain.gain.value])};
}
function validateScene(data) {
  const finite = (value,min,max) => typeof value === 'number' && Number.isFinite(value) && value >= min && value <= max;
  if (!data || data.version !== 1 || !Array.isArray(data.listener) || data.listener.length !== 3 || !data.listener.every(n => finite(n,-100,100)) || !Array.isArray(data.speakers) || data.speakers.length > 32 || !data.speakers.every(s => Array.isArray(s) && s.length === 5 && finite(s[0],-5,5) && finite(s[1],0,5) && finite(s[2],-5,5) && finite(s[3],100,2000) && finite(s[4],0,1))) throw new Error('The saved scene is invalid. Your current scene is unchanged.');
  return data;
}
function applyScene(data) {
  validateScene(data);
  audioStartVersion++;
  audioPending = false;
  audioEnabled = false;
  masterGain.gain.setTargetAtTime(0,audioCtx.currentTime,0.02);
  toggleAudio.textContent = 'Start audio';
  toggleAudio.setAttribute('aria-pressed','false');
  while (speakers.length) { selectedSpeaker = speakers[0]; removeSelectedSpeaker(); }
  nextSpeakerId = 1;
  data.speakers.forEach(([x,y,z,hz,volume]) => { const speaker = createSpeaker(x,y,z); speaker.osc.frequency.value = hz; speaker.gain.gain.value = volume; });
  camera.position.set(...data.listener);
  selectSpeaker(speakers[0] || null);
  updateListenerReadout();
  audioStatus.textContent = speakers.length ? 'Audio stopped.' : 'No speakers. Add a speaker to continue.';
}
document.getElementById('applyScene').onclick = () => {
  const preset = SCENE_PRESETS[document.getElementById('scenePreset').value];
  applyScene({version:1,listener:[0,2,6],speakers:preset});
  document.getElementById('sceneStatus').textContent = 'Preset applied.';
  document.getElementById('applyScene').focus();
};
document.getElementById('saveScene').onclick = () => {
  try { localStorage.setItem(SCENE_KEY,JSON.stringify(serializeScene())); document.getElementById('sceneStatus').textContent = 'Scene saved in this browser.'; }
  catch { document.getElementById('sceneStatus').textContent = 'Browser storage is unavailable. Scene was not saved.'; }
};
document.getElementById('loadScene').onclick = () => {
  try {
    const raw = localStorage.getItem(SCENE_KEY);
    if (!raw) throw new Error('No saved scene in this browser.');
    applyScene(JSON.parse(raw));
    document.getElementById('sceneStatus').textContent = 'Scene restored. Audio stopped.';
  } catch { document.getElementById('sceneStatus').textContent = 'No usable saved scene. Your current scene is unchanged.'; }
  document.getElementById('loadScene').focus();
};
['X','Y','Z'].forEach(axis => {
  const input = document.getElementById('speaker'+axis);
  input.onchange = () => {
    if (!selectedSpeaker) return;
    const value = Number(input.value), min = axis === 'Y' ? 0 : -5;
    if (input.value.trim() && Number.isFinite(value) && value >= min && value <= 5) selectedSpeaker.mesh.position[axis.toLowerCase()] = value;
    input.value = String(selectedSpeaker.mesh.position[axis.toLowerCase()]);
  };
});

// ===== INTERACTION (CLICK SELECT) =====
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener("click", (event) => {
  const bounds = renderer.domElement.getBoundingClientRect();
  if (!bounds.width || !bounds.height) return;
  mouse.x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
  mouse.y = -((event.clientY - bounds.top) / bounds.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const meshes = speakers.map(s => s.mesh);
  const intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    selectSpeaker(speakers.find(s => s.mesh === intersects[0].object));
  }
});

// ===== AUDIO POSITION UPDATE =====
function updateAudio() {
  speakers.forEach(s => {
    s.panner.positionX.value = s.mesh.position.x;
    s.panner.positionY.value = s.mesh.position.y;
    s.panner.positionZ.value = s.mesh.position.z;
  });

  audioCtx.listener.positionX.value = camera.position.x;
  audioCtx.listener.positionY.value = camera.position.y;
  audioCtx.listener.positionZ.value = camera.position.z;
}

// ===== BASIC CAMERA CONTROL =====
function updateListenerReadout() {
  document.getElementById('listenerPosition').textContent = `Listener  X ${camera.position.x.toFixed(1)} · Z ${camera.position.z.toFixed(1)}`;
}
updateListenerReadout();
function moveListener(direction) {
  const speed = 0.3;
  if (direction === "w") camera.position.z -= speed;
  if (direction === "s") camera.position.z += speed;
  if (direction === "a") camera.position.x -= speed;
  if (direction === "d") camera.position.x += speed;
  camera.position.x = Math.max(-100,Math.min(100,camera.position.x));
  camera.position.z = Math.max(-100,Math.min(100,camera.position.z));
  updateListenerReadout();
}
window.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.target?.isContentEditable || ["INPUT", "SELECT", "TEXTAREA"].includes(e.target?.tagName)) return;
  const direction = e.key.toLowerCase();
  if ('wasd'.includes(direction) && direction.length === 1) moveListener(direction);
});
document.querySelectorAll('[data-move]').forEach(button => {
  button.onclick = () => moveListener(button.dataset.move);
});

// ===== LOOP =====
function animate() {
  requestAnimationFrame(animate);
  updateAudio();
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  const viewport = sceneViewport();
  camera.aspect = viewport.width/viewport.height;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.width, viewport.height);
});

</script>
</body>
</html>
